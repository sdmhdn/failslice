[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "failslice"
dynamic = ["version"]
description = "Shrink multi-table data to a small, FK-consistent, verified reproducer of a data bug."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saeed Mahdian", email = "saeed.mahdian@gmail.com" }]
maintainers = [{ name = "Saeed Mahdian", email = "saeed.mahdian@gmail.com" }]
keywords = ["delta-debugging", "test-case-reduction", "duckdb", "data-quality", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# Runtime dependencies are chosen in Phase 1/2 (see docs/decisions/).
dependencies = []

[project.urls]
Homepage = "https://github.com/sdmhdn/failslice"
Issues = "https://github.com/sdmhdn/failslice/issues"
Changelog = "https://github.com/sdmhdn/failslice/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "hypothesis>=6.170",
    "ruff>=0.17.5",
    "mypy>=2.4",
]

[tool.hatch.version]
path = "src/failslice/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/failslice"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/failslice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["failslice"]
branch = true
