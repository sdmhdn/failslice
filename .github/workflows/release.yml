name: release

# Publishes failslice and failslice-mcp with PyPI Trusted Publishing (no API tokens).
# Manual only, dispatched ON the tag v<version> (`gh workflow run release.yml --ref
# v<version> ...`), whose commit passed CI. The environments `testpypi` and `pypi` allow
# only tags v* and require the owner's approval. See docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (the tag v<version> must exist), e.g. 0.1.0"
        required: true
        type: string
      target:
        description: "Package index"
        required: true
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build and check v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # look up the CI run of the tagged commit
    steps:
      - name: The workflow runs on the tag of the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "ref: $GITHUB_REF"
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: The tag, the package versions and server.json agree
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json, os, re, tomllib
          v = os.environ["VERSION"]
          init = open("src/failslice/__init__.py", encoding="utf-8").read()
          core = re.search(r'__version__ = "([^"]+)"', init).group(1)
          with open("packages/failslice-mcp/pyproject.toml", "rb") as fh:
              shim = tomllib.load(fh)["project"]
          server = json.load(open("server.json", encoding="utf-8"))
          found = {
              "failslice": core,
              "failslice-mcp": shim["version"],
              "failslice-mcp pin": shim["dependencies"][0].removeprefix("failslice=="),
              "server.json": server["version"],
              "server.json package": server["packages"][0]["version"],
          }
          bad = {k: x for k, x in found.items() if x != v}
          assert not bad, f"version {v} expected, found {bad}"
          print("versions agree:", v)
          PY
      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" \
                 --status success --json databaseId --jq length)
          echo "successful CI runs for $sha: $ok"
          test "$ok" -ge 1
      - name: Build (wheels from the sdists)
        run: |
          uv build --no-sources --out-dir dist/core
          uv build --no-sources --package failslice-mcp --out-dir dist/mcp
      - name: Check metadata
        run: uvx twine==7.0.0 check --strict dist/core/* dist/mcp/*
      - name: Smoke-test the wheels in a clean environment outside the checkout
        env:
          VERSION: ${{ inputs.version }}
        run: |
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work"
          cp scripts/smoke_installed.py "$work/"
          uv venv "$work/venv" --python 3.12
          uv pip install --python "$work/venv" dist/core/*.whl dist/mcp/*.whl pytest
          cd "$work" && "$work/venv/bin/python" -I smoke_installed.py --expect-version "$VERSION" run
      - name: Record hashes
        run: |
          (cd dist && sha256sum core/* mcp/* | tee SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-core:
    name: publish failslice to ${{ inputs.target }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    permissions:
      id-token: write # Trusted Publishing; this job only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/core
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  publish-mcp:
    name: publish failslice-mcp to ${{ inputs.target }}
    needs: publish-core # the shim pins failslice==<version>, so the core goes first
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/mcp
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
