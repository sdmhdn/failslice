name: CI

on:
  push:
    branches: [main, "phase-*/**", "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push and a pull request for the same branch share one group (no duplicate matrix).
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      # The suite includes the examples (tests/test_examples.py) as smoke tests. The TPC-H
      # example downloads DuckDB's tpch extension; on Python 3.12 (all three OSes) it must
      # run, elsewhere it is skipped if the extension cannot be installed.
      - run: uv run pytest --cov --cov-fail-under=90 -q
        env:
          FAILSLICE_REQUIRE_TPCH: ${{ matrix.python == '3.12' && '1' || '' }}

  package:
    # Build both distributions, check their metadata, install the wheels into a clean
    # environment outside the checkout and run the CLI, the demo, the generated test and
    # the MCP server over stdio (scripts/smoke_installed.py). One Python per OS; the test
    # matrix covers interpreter compatibility.
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Build (wheels from the sdists)
        run: |
          uv build --no-sources --out-dir dist
          uv build --no-sources --package failslice-mcp --out-dir dist
      - run: uvx twine==7.0.0 check --strict dist/*
      - name: Smoke-test the installed wheels
        run: |
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work"
          cp scripts/smoke_installed.py "$work/"
          uv venv "$work/venv" --python 3.12
          uv pip install --python "$work/venv" dist/*.whl pytest
          if [ -x "$work/venv/Scripts/python.exe" ]; then py="$work/venv/Scripts/python.exe"; else py="$work/venv/bin/python"; fi
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/failslice/__init__.py)
          cd "$work" && "$py" -I smoke_installed.py --expect-version "$version" run
